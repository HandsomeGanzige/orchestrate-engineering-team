name: Compatibility report
description: Report a Codex version, operating system, or runtime-capability issue.
title: "[Compatibility]: "
labels:
  - compatibility
body:
  - type: input
    id: codex-version
    attributes:
      label: Codex version
      placeholder: codex-cli 0.x.y
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, shell, and relevant workspace restrictions.
    validations:
      required: true
  - type: dropdown
    id: capability
    attributes:
      label: Capability involved
      options:
        - Plugin marketplace or installation
        - Skill discovery or invocation
        - Native subagents
        - Workspace or shell permissions
        - Other Codex behavior
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details and reproduction
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
