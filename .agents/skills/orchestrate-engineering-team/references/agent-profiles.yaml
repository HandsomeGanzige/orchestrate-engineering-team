enforcement: advisory

profiles:
  development:
    name: Development Agent
    route_when: A bounded Todo requires production implementation or implementation-owned tests.
    skill:
      name: develop-work-item
      path: .agents/skills/develop-work-item/SKILL.md
    write_scope: assigned-production-files-or-modules-only
    capabilities:
      required: [workspace-read, workspace-write, shell]
      optional: [browser, external-docs]
      prohibited: [task-state-write, user-decision]
    context:
      - assignment-id
      - attempt-id-and-immutable-contract-digest
      - objective-and-done-conditions
      - confirmed-decisions
      - exact-project-fact-pointers
      - allowed-read-and-write-scope
      - capability-availability
    returns: &development-envelope
      - status
      - summary
      - artifacts
      - files
      - checks
      - requires_test
      - test_reason
      - requires_review
      - review_reason
      - blockers

  test:
    name: Test Agent
    route_when: A delivered behavior requires the default independent verification or a focused retest.
    skill:
      name: verify-work-item
      path: .agents/skills/verify-work-item/SKILL.md
    write_scope: read-only-except-disposable-command-artifacts
    capabilities:
      required: [workspace-read, shell]
      optional: [browser]
      prohibited: [production-write, test-write, task-state-write, user-decision]
    context:
      - assignment-id
      - attempt-id-and-immutable-contract-digest
      - expected-behavior-and-done-conditions
      - changed-surface
      - exact-project-fact-pointers
      - available-verification-methods
      - capability-availability
    returns: &verification-envelope
      - status
      - summary
      - files
      - checks
      - evidence_method
      - findings
      - blockers

  review:
    name: Review Agent
    route_when: A delivered change requires the default independent defect, alignment, regression, and maintainability review or a focused rereview.
    skill:
      name: review-work-item
      path: .agents/skills/review-work-item/SKILL.md
    write_scope: read-only
    capabilities:
      required: [workspace-read, code-search]
      optional: [diff, security-analysis]
      prohibited: [production-write, test-write, task-state-write, user-decision]
    context:
      - assignment-id
      - attempt-id-and-immutable-contract-digest
      - confirmed-goal-and-decisions
      - changed-surface
      - exact-project-fact-pointers
      - concise-verification-summary
      - capability-availability
    returns: *verification-envelope

  architecture:
    name: Architecture Agent
    route_when: A bounded decision needs project-grounded alternatives, tradeoffs, research, or a recommendation.
    skill:
      name: architect-work-item
      path: .agents/skills/architect-work-item/SKILL.md
    write_scope: read-only
    capabilities:
      required: [workspace-read]
      optional: [web-search, external-docs, diagramming]
      prohibited: [production-write, task-state-write, user-decision]
    context:
      - assignment-id
      - attempt-id-and-immutable-contract-digest
      - objective-and-done-conditions
      - confirmed-constraints-and-decisions
      - exact-project-fact-pointers
      - capability-availability
    returns:
      - status
      - summary
      - artifacts
      - decision_proposals
      - files
      - checks
      - requires_test
      - test_reason
      - requires_review
      - review_reason
      - blockers
