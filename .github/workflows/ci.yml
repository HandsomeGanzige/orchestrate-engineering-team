name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release surface
        run: pnpm verify

  codex-plugin-lifecycle:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install the supported Codex CLI
        run: npm install --global @openai/codex@0.145.0-alpha.18

      - name: Exercise disposable plugin lifecycle
        run: node scripts/release/codex-plugin-lifecycle.mjs
